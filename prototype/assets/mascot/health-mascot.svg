<svg xmlns="http://www.w3.org/2000/svg" width="224.68" height="217.94" viewBox="-10 -16 200 194" fill="none">
  <title>Помощник по здоровью</title>
  <desc>Голубой круглый маскот с двумя светлыми глазами и тремя дугами активности. Оранжевая дуга — сожжённые калории, синяя — пройденная дистанция, зелёная — съеденные калории. Все элементы — редактируемые векторные формы.</desc>
  <defs>
    <clipPath id="head-clip"><circle cx="79.307" cy="79.307" r="79.307"/></clipPath>
    <linearGradient id="head-blue" x1="79" y1="0" x2="79" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00BCF7"/><stop offset=".28" stop-color="#00A4FF"/><stop offset=".65" stop-color="#008CFF"/><stop offset="1" stop-color="#00B8F7"/>
    </linearGradient>
    <radialGradient id="face-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(79.6 118.6) scale(92 77.5)">
      <stop stop-color="#00AFF5"/><stop offset=".43" stop-color="#00B3F8"/><stop offset=".62" stop-color="#00BEFA"/><stop offset=".72" stop-color="#4BCEFD"/><stop offset=".82" stop-color="#A5E4FD"/><stop offset=".93" stop-color="#DFF5FE"/><stop offset=".985" stop-color="#F4FCFD"/><stop offset="1" stop-color="#DCF6FC"/>
    </radialGradient>
    <radialGradient id="lower-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(79 158) scale(60 50)">
      <stop stop-color="#00DBFF" stop-opacity=".48"/><stop offset="1" stop-color="#00DBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere-edge" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(79.307 79.307) scale(79.307)">
      <stop offset=".77" stop-color="#DBF7FF" stop-opacity="0"/><stop offset=".94" stop-color="#DBF7FF" stop-opacity=".06"/><stop offset="1" stop-color="#DBF7FF" stop-opacity=".3"/>
    </radialGradient>
    <linearGradient id="eyes" x1="0" y1="70" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFB"/><stop offset=".45" stop-color="#D8F5FC"/><stop offset="1" stop-color="#9CE5FA"/>
    </linearGradient>
    <radialGradient id="eye-shadow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(21 26)">
      <stop offset=".3" stop-color="#006B9F" stop-opacity=".23"/><stop offset="1" stop-color="#006B9F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="mascot" transform="translate(10.62 0)">
    <g id="mascot-body" clip-path="url(#head-clip)">
      <circle cx="79.307" cy="79.307" r="79.307" fill="url(#head-blue)"/>
      <ellipse cx="79.6" cy="118.6" rx="92" ry="77.5" fill="url(#face-glow)"/>
      <ellipse cx="79" cy="148" rx="78" ry="51" fill="url(#lower-light)"/>
      <circle cx="79.307" cy="79.307" r="79.307" fill="url(#sphere-edge)"/>
    </g>
    <g id="mascot-eyes">
      <ellipse transform="translate(69 101) rotate(-10)" rx="21" ry="26" fill="url(#eye-shadow)"/>
      <ellipse transform="translate(111 93) rotate(-9)" rx="21" ry="26" fill="url(#eye-shadow)"/>
      <ellipse cx="66.8" cy="97.2" rx="14.1" ry="18.2" transform="rotate(-10 66.8 97.2)" fill="url(#eyes)"/>
      <ellipse cx="108.5" cy="88.6" rx="14" ry="18.2" transform="rotate(-9 108.5 88.6)" fill="url(#eyes)"/>
    </g>
  </g>
