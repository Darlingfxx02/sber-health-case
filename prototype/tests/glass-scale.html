<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Liquid Glass · scale regression</title>
<link rel="stylesheet" href="app.bundle.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="health-overview.css"><link rel="stylesheet" href="typography.css"><link rel="stylesheet" href="app-shell.css">
<style>:root{--test-scale:.6}.scale-test-controls{position:fixed;top:8px;left:8px;z-index:100;display:flex;gap:8px}.scale-test-controls button{padding:10px;border-radius:8px;background:white;font:14px system-ui}.workbench{display:none}.stage{padding-top:65px;justify-content:flex-start}.device-size{--scale:var(--test-scale)!important}.device-size.test-nested{transform:scale(.8);transform-origin:top center}</style></head><body>
<nav class="scale-test-controls" aria-label="Тест масштаба"><button data-scale=".6">60%</button><button data-scale=".8">80%</button><button data-scale="1">100%</button><button data-scale="1.25">125%</button><button id="nested-scale">Вложенный ×0.8</button></nav>
<div id="root"></div><script type="module" src="app.bundle.js"></script><script>document.querySelectorAll('[data-scale]').forEach(button=>button.onclick=()=>document.documentElement.style.setProperty('--test-scale',button.dataset.scale));document.querySelector('#nested-scale').onclick=()=>document.querySelector('.device-size').classList.toggle('test-nested');</script></body></html>
